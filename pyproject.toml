[project]
name = "daily-brief"
version = "0.1.0"
description = "SDD-driven daily report pipeline"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pyyaml>=6,<7", "jinja2>=3.1.6,<4", "markdown>=3.7,<4", "pydantic>=2.10,<3", "chinese-calendar>=1.10,<2", "tzdata>=2025.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-Markdown"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
